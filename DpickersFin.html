<!DOCTYPE html>
<html lang='zh-CN'>
    <head>
        <meta charset='utf-8'>
        <style>
            #zhuniu {
                /*按钮*/
                background-color          : #6da;
                color                     : #81a;
                border                    : 2px solid #caf;
            }
            #gunfu::before {
                /*模糊背景*/
                content                   : "";
                background                : url("https://s1.imagehub.cc/images/2026/10/27/d64d45adfe89502aa6ca3a447ba7bbec.th.png") center / cover no-repeat;
                filter                    : blur(20px);
                position                  : absolute;
                inset                     : -20px;
                z-index                   : -1;
            }
            #gunfu {
                /*大框架*/
                position                  : relative;
                width                     : auto;
                min-height                : 70vh;
                isolation                 : isolate;
                overflow                  : hidden;
            }
            #gunfu div {
        body {  margin                    : 0;
                padding                   : 0;
        }
            }
            #babaliu {
                /*开场界面*/
                background                : url("https://s1.imagehub.cc/images/2026/10/27/7af68a24a61d98d5405468e5e568cca7.jpg") center / 5% auto repeat;
                display                   : flex;
                flex-direction            : row;
                align-items               : center;
                justify-content           : center;
                width                     : 100vw;
                min-height                : 100vh;
            }
            #gunmu {
                /*图片展示界面*/
                background                : url("https://s1.imagehub.cc/images/2026/10/27/d64d45adfe89502aa6ca3a447ba7bbec.th.png") center / 100% auto no-repeat;
                display                   : flex;
                flex-direction            : column;
                align-items               : center;
                justify-content           : flex-start;
                width                     : 100vw;
                min-height                : 130vh;
                gap                       : 3vw;
            }
            #zheqishenle {
                /*图片展示界面橙字*/
                color                     : #fc7;
                text-shadow               : 1px 1px 0.3vw #a50f;
                font-size                 : 45px;
                line-height               : 1;
                margin                    : 1vh;
                padding                   : 0;
            }
            #laodabo {
                /*图片框*/
                display                   : grid;
                grid-template-columns     : minmax(0, 0.5fr) minmax(0, 1fr );
                grid-template-rows        : minmax(0, 1fr  ) minmax(0, 1fr );
                gap                       : 1vw;
                align-items               : stretch;
                align-content             : center;
                justify-items             : stretch;
                width                     : 70vw;
                height                    : 70vw;
                overflow                  : hidden;
            }
            #gunfu button {
                box-sizing                : border-box;
                width                     : 60vw;
                height                    : 12vw;
                display                   : inline-flex;
                justify-content           : center;
                align-items               : center;
                padding                   : 1vw;
                border-radius             : 5vw 5vw 0 5vw;
                font-size                 : 35px;
            }
            #zhuniu2 {
                /*按钮*/
                background-color          : #09c;
                color                     : #feb;
                border                    : 2px solid #dca;
            }
            #erweima {
                width                     : 50vw;
                height                    : auto;
            }
            .j666 {
                /*彩带*/
                --randy                   : 0;
                --randu                   : 0;
                --randa                   : 0;
                --randes                  : 0;
                position                  : fixed;
                top                       : -5%;
                background-color          : #fac;
                width                     : 1vw;
                height                    : 2vw;
                animation                 : shabi 6s ease-in;
                animation-iteration-count : 1;
                animation-fill-mode       : forwards;
            }
            @keyframes shabi {
                0%   {
                    transform : translate(var(--randes), 0    ) rotate(var(--randy));
                }
                100% {
                    transform : translate(var(--randu) , 100vh) rotate(var(--randa));
                }
            }
        </style>
    <body>
            <div id="gunfu">
                <audio autoplay src="https://mp3tourl.com/audio/1793259647752-01400446-4449-4375-9c0a-e06b575c5e12.m4a" loop>阿米诺斯</audio>
                <div id="babaliu">
                    <button type="button" id="zhuniu" onclick="goush()">🔞点我查看第美图😍🔞</button>
                </div>
                <script id="dpic" type="application/json">
                    [
                        "https://s1.imagehub.cc/images/2026/10/27/6d24eece6cd17d2e166a6f7557bf1152.png",
                        "https://s1.imagehub.cc/images/2026/10/27/66ca9e0428f5c2e0e6e4f50f23bb931b.png",
                        "https://s1.imagehub.cc/images/2026/10/27/955660ed22b338851a5cd25afd3dd2c5.png"
                    ]
                </script>
                <script>
                    function goush() {
                        const ji             = document.createElement('div' );
                        const jsh            = document.createElement('h1'  );
                        const dpi            = JSON    .parse        (document.getElementById('dpic').textContent);
                        ji .id               = "gunmu";
                        jsh.id               = "zheqishenle";
                        jsh.textContent      = "卧槽这些好牛逼呀好牛逼这些中！？？！！？？！";
                        const Gunfu          = document.getElementById('gunfu' );
                        document.getElementById('babaliu').remove     (   );
                        Gunfu                             .appendChild(ji );
                        document.getElementById('gunmu'  ).appendChild(jsh);
                        const Gunmu    = document.getElementById('gunmu'  );
                        const imgcount = dpi.length;
                        let   laodabox = 0;
                        laodabox.id    = "laodabo";
                        for ( let i = 1 ; i <= imgcount ; i++ ) {
                            if ( (i - 1) % 3 == 0 ) {
                                laodabox    = document.createElement('div');
                                laodabox.id = "laodabo";
                                Gunmu.appendChild(laodabox);
                            }
                            const dpick                 = document.createElement('img');
                            dpick.src                   = String(dpi[i-1]);
                            dpick.alt                   = "os：D好帅桑吉斯好帅，哎哟卧槽你的网怎么爆炸了";
                            dpick.style.display         = "block";
                            dpick.style.objectFit       = "contain";
                            dpick.style.backgroundColor = "#55f";
                            if ( i % 3 == 2 ) {
                                dpick.style.gridRow = "span 2";
                            } else {
                                dpick.style.gridRow = "span 1";
                            } 
                            laodabox.appendChild(dpick);
                        }
                        const jier       = document.createElement('button');
                        jier.id          = "zhuniu2";
                        jier.textContent = "好牛逼呀我还要吃。🤑🤩";
                        let disable      = true;
                        jier.onclick     = () => {
                            alert("扫码直接加入Sprunki黯巢AU官方群💪💪💪");
                            if (disable) {
                                disable      = false;
                                const anchao = document.createElement('img');
                                anchao.id    = "erweima";
                                anchao.src   = "https://s1.imagehub.cc/images/2026/10/29/ddc367f955be4c60c808f1612632f60e.md.jpeg";
                                anchao.alt   = "点击链接加入群聊【sprunki黯巢AU】：https://qm.qq.com/q/dqUvXsBeEw";
                                document.getElementById('gunmu').appendChild(anchao);
                            }
                        };
                        Gunmu.appendChild (jier);
                        const color = ["#fac","#fea","#acf","#afc","#daf"];
                        setInterval(() => {
                            let rando                   = Math.random() * color.length | 0;
                            if (rando == color.length) {rando --;}
                            const caibi                 = document.createElement('div');
                            caibi.className             = "j666";
                            caibi.style.backgroundColor = color[rando];
                            caibi.style.setProperty("--randy" , Math.random() * 360  - 360  + "deg");
                            caibi.style.setProperty("--randa" , Math.random() * 1000 - 1000 + "deg");
                            caibi.style.setProperty("--randes", Math.random() * 100         + "vw" );
                            caibi.style.setProperty("--randu" , Math.random() * 100         + "vw" );
                            Gunfu.appendChild(caibi);
                            setTimeout(() => { caibi.remove() }, 6000); 
                        }, 1000);
                    }
                </script>
            </div>
    </body>
